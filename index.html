<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fumetti in uscita</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<meta name="theme-color" content="#14213d">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f6;--card:#fff;--ink:#14213d;--mut:#5b6478;--pop:#ffd23f;--red:#e63946;--ok:#2a9d5c;--line:#14213d}
@media(prefers-color-scheme:dark){:root{--bg:#0d1526;--card:#1a2744;--ink:#f1f4fa;--mut:#9aa6c2;--line:#f1f4fa}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 Barlow,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{background:#14213d;color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font:400 2rem Bangers,Impact,sans-serif;letter-spacing:.04em;margin:0;flex:1;color:var(--pop)}
main{max-width:760px;margin:0 auto;padding:14px}
button,input,select,textarea{font:inherit;color:inherit}
.btn{border:2px solid var(--line);background:var(--pop);color:#14213d;font-weight:700;padding:8px 14px;border-radius:6px;cursor:pointer}
.btn.g{background:transparent;color:inherit;border-color:currentColor;font-weight:600;padding:6px 10px}
header .btn.g{color:#fff}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.tab{border:2px solid var(--line);background:var(--card);padding:6px 12px;border-radius:99px;cursor:pointer;white-space:nowrap;font-weight:600}
.tab[aria-selected=true]{background:var(--ink);color:var(--bg)}
.bar{display:flex;gap:8px;margin:10px 0}
.bar input{flex:1;min-width:0}
input,select,textarea{width:100%;padding:8px 10px;border:2px solid var(--line);border-radius:6px;background:var(--card)}
.card{background:var(--card);border:2px solid var(--line);box-shadow:4px 4px 0 var(--line);border-radius:6px;padding:12px;margin:12px 0 14px;display:grid;grid-template-columns:auto 56px 1fr auto;gap:10px;align-items:center}
.card.bought{opacity:.6}
.card h3{margin:0;font-size:1.1rem}
.meta{color:var(--mut);font-size:.9rem}
.chk{width:30px;height:30px;border:2px solid var(--line);border-radius:6px;background:var(--card);cursor:pointer;font-size:1.2rem;font-weight:700;color:var(--ok);line-height:1}
.badge{display:inline-block;font-weight:700;font-size:.85rem;padding:2px 8px;border-radius:4px;border:2px solid var(--line);margin-top:4px}
.soon{background:var(--pop);color:#14213d}.out{background:var(--red);color:#fff;border-color:var(--red)}.later{background:transparent}
.acts{display:flex;flex-direction:column;gap:4px}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
dialog{border:3px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);max-width:460px;width:calc(100% - 24px);padding:16px}
dialog::backdrop{background:rgba(0,0,0,.55)}
label{display:block;font-weight:600;font-size:.9rem;margin-top:10px}
.row{display:flex;gap:8px}.row>*{flex:1}
.set{display:flex;align-items:center;gap:8px;margin-top:10px}.set input{width:auto}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;display:none}
@media(prefers-reduced-motion:no-preference){.card{transition:transform .12s}.card:active{transform:translate(2px,2px)}}
dialog{max-height:92vh;overflow:auto}
.cov{width:56px;height:80px;border:2px solid var(--line);border-radius:4px;background:var(--pop);color:#14213d;display:grid;place-items:center;font:400 1.6rem Bangers,Impact,sans-serif;overflow:hidden}
.cov img{width:100%;height:100%;object-fit:cover}
.grp{background:var(--card);border:2px solid var(--line);box-shadow:4px 4px 0 var(--line);border-radius:6px;padding:12px;margin:12px 0 14px}
.stat{display:flex;gap:10px;align-items:center;margin:6px 0}.stat span:first-child{width:64px}
.bar2{height:14px;background:var(--red);border-radius:3px;min-width:2px}
.cf{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
video{width:100%;border-radius:6px;background:#000}
/* Adattamento Galaxy A27 5G: 6.7", 1080x2340, ~400px CSS, uso a una mano */
@media(prefers-color-scheme:dark){:root{--bg:#05070d;--card:#111a2e}}
main{padding-bottom:104px}
input,select,textarea{min-height:44px}
input[type=checkbox]{min-height:0;width:22px;height:22px}
.btn,.btn.g,.tab{min-height:44px}
.tabs{position:sticky;top:0;z-index:4;background:var(--bg);padding:8px 0}
.card{grid-template-columns:44px 64px 1fr;align-items:start}
.card .chk{align-self:start}
.cov{width:64px;height:92px}
.acts{grid-column:1/-1;flex-direction:row;gap:8px}.acts .btn{flex:1}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));min-height:54px;padding:0 22px;border-radius:27px;box-shadow:4px 4px 0 var(--line);z-index:6;font-size:1.05rem}
.chk{width:44px;height:44px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px;margin-top:12px}
.gc{position:relative}
.cov.big{width:100%;height:auto;aspect-ratio:2/3;font-size:2.6rem;cursor:pointer;box-shadow:3px 3px 0 var(--line)}
.gc .chk{position:absolute;top:4px;right:4px;width:40px;height:40px;background:var(--card)}
.gc.bought .cov{opacity:.55}
.gt{font-weight:700;font-size:.85rem;line-height:1.2;margin-top:8px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.gc .badge{font-size:.75rem;margin-top:4px}
dialog{width:100%;max-width:520px;max-height:92dvh;margin:auto auto 0;border-radius:16px 16px 0 0;border-bottom-width:0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
/* Ragnatela e suggerimenti */
header,main{position:relative;z-index:1}
.web{position:fixed;bottom:0;width:min(78vw,380px);aspect-ratio:1;pointer-events:none;z-index:0;filter:drop-shadow(0 0 3px #ff7a00) drop-shadow(2px 3px 1px rgba(255,122,0,.8))}
.web.r{right:0}.web.l{left:0;transform:scaleX(-1)}
.sug{margin-top:6px;border:2px solid var(--line);border-radius:8px;background:var(--card);max-height:270px;overflow:auto}
.sug button{display:flex;gap:10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--mut);padding:8px;cursor:pointer;align-items:center;min-height:64px}
.sug img,.sug .ph{width:36px;height:52px;object-fit:cover;border-radius:3px;border:1px solid var(--line);flex:none;background:var(--pop)}
.sug b{display:block;line-height:1.2}.sug small{color:var(--mut)}
</style>
</head>
<body>
<header>
<h1>FUMETTI IN USCITA</h1>
<button class="btn g" id="bSet">Impostazioni</button>
</header>
<main>
<div class="tabs" role="tablist" id="tabs"></div>
<div class="bar"><input id="q" type="search" placeholder="Cerca titolo o editore" aria-label="Cerca"><button class="btn g" id="bView" style="flex:none;width:92px">Griglia</button></div>
<div id="list"></div>
</main>

<button class="btn fab" id="bAdd">+ Aggiungi</button>
<dialog id="dForm"><form method="dialog" id="f">
<h2 id="fT" style="margin:0">Nuovo fumetto</h2>
<label>Titolo<input id="fTitle" required autocomplete="off" placeholder="Scrivi: tex, dylan dog, topolino..."></label><div class="sug" id="sug" hidden></div>
<div class="row"><label>Numero / volume<input id="fNum" placeholder="es. 12"></label>
<label>Tipo<select id="fType"><option value="serie">Serie</option><option value="oneshot">One-shot</option></select></label></div>
<div class="row"><label>Data di uscita<input id="fDate" type="date" required></label>
<label>Prezzo (€)<input id="fPrice" type="number" step="0.01" min="0"></label></div>
<div class="row"><label>Editore<input id="fPub" placeholder="Bonelli, Panini, Bao..."></label>
<label>Dove<select id="fWhere"><option>Edicola</option><option>Fumetteria</option><option>Libreria</option><option>Online</option></select></label></div>
<label>ISBN / codice a barre<input id="fIsbn" inputmode="numeric"></label>
<label>Copertina (link o foto)<input id="fCover" placeholder="https://..."></label>
<div class="cf"><button type="button" class="btn g" id="bScan">Scansiona codice</button><button type="button" class="btn g" id="bFind">Trova copertina</button><button type="button" class="btn g" id="bPhoto">Foto / file</button></div>
<input type="file" id="fPhoto" accept="image/*" hidden>
<label>Note<textarea id="fNotes" rows="2"></textarea></label>
<div class="set"><input type="checkbox" id="fRep"><label for="fRep" style="margin:0">Aggiungi anche i prossimi 5 numeri (mensili)</label></div>
<div class="row" style="margin-top:14px"><button type="button" class="btn g" id="fDel" hidden>Elimina</button><button type="button" class="btn g" id="fCancel">Annulla</button><button class="btn" id="fSave" value="ok">Salva</button></div>
</form></dialog>

<dialog id="dSet">
<h2 style="margin:0">Impostazioni</h2>
<div class="set"><input type="checkbox" id="sNotif"><label for="sNotif" style="margin:0">Notifiche attive</label></div>
<label>Avvisami prima (giorni)<input id="sDays" type="number" min="1" max="30"></label>
<p class="meta">Le notifiche arrivano quando apri l'app. Per avvisi anche ad app chiusa, esporta il calendario: il telefono ti avvisa da solo.</p>
<label>Chiave API Google Books (facoltativa, evita i limiti di ricerca)<input id="gKey" autocomplete="off"></label>
<div class="set"><input type="checkbox" id="sAlt"><label for="sAlt" style="margin:0">Ricerca estesa su Google Books e Open Library (altri editori)</label></div>
<p class="meta" id="catInfo"></p>
<h3 style="margin:16px 0 0">Sincronizzazione GitHub</h3>
<label>Repository (utente/nome)<input id="gRepo" placeholder="tuonome/fumetti"></label>
<label>Token (permesso Contents, solo questo repo)<input id="gTok" type="password" autocomplete="off"></label>
<div class="set"><input type="checkbox" id="gAuto"><label for="gAuto" style="margin:0">Salva in automatico ad ogni modifica</label></div>
<div class="row" style="margin-top:8px"><button class="btn g" id="gPush">Salva su GitHub</button><button class="btn g" id="gPull">Ripristina da GitHub</button></div>
<div class="row" style="margin-top:14px"><button class="btn g" id="bIcs">Esporta calendario (.ics)</button></div>
<div class="row" style="margin-top:8px"><button class="btn g" id="bExp">Salva backup</button><button class="btn g" id="bImp">Ripristina backup</button></div>
<input type="file" id="file" accept="application/json" hidden>
<div class="row" style="margin-top:14px"><button class="btn" id="sClose">Chiudi</button></div>
</dialog>
<dialog id="dScan"><video id="vid" playsinline muted></video><div class="row" style="margin-top:10px"><button class="btn g" id="scClose">Chiudi</button></div></dialog>
<div id="toast" role="status"></div>

<script>
const KI='fumetti.items.v1',KS='fumetti.set.v1',KN='fumetti.notified.v1';
const $=s=>document.querySelector(s);
const rd=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
const wr=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{toast('Salvataggio non riuscito')}};
let items=rd(KI,[]),set=Object.assign({notif:false,days:3},rd(KS,{})),sent=rd(KN,{}),tab='next',editId=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const days=d=>Math.round((new Date(d+'T00:00:00')-new Date(new Date().toDateString()))/864e5);
const fmt=d=>new Date(d+'T00:00:00').toLocaleDateString('it-IT',{day:'numeric',month:'short',year:'numeric'});
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2500)}
let svT;const save=skip=>{wr(KI,items);if(skip!==true&&set.gh&&set.gh.auto&&gh()){clearTimeout(svT);svT=setTimeout(()=>push(true),2500)}};

const TABS=[['next','Prossime'],['new','Novità'],['buy','Da comprare'],['done','Acquistati'],['all','Tutti'],['series','Serie'],['stats','Statistiche']];
function render(){
 $('#tabs').innerHTML=TABS.map(([k,l])=>`<button class="tab" role="tab" aria-selected="${k===tab}" data-t="${k}">${l}</button>`).join('');
 const q=$('#q').value.toLowerCase();$('#bView').textContent=set.view==='grid'?'Lista':'Griglia';if(tab==='new'){$('#list').innerHTML=newView(q);return}if(tab==='series'){$('#list').innerHTML=seriesView(q);return}if(tab==='stats'){$('#list').innerHTML=statsView();return}
 let v=items.filter(i=>(i.title+' '+(i.pub||'')).toLowerCase().includes(q));
 if(tab==='next')v=v.filter(i=>!i.bought&&days(i.date)>0);
 if(tab==='buy')v=v.filter(i=>!i.bought&&days(i.date)<=0);
 if(tab==='done')v=v.filter(i=>i.bought);
 v.sort((a,b)=>a.date.localeCompare(b.date));
 if(tab==='done'||tab==='buy')v.reverse();
 $('#list').innerHTML=v.length?(set.view==='grid'?'<div class="grid">'+v.map(gcard).join('')+'</div>':v.map(card).join('')):`<div class="empty">${items.length?'Nessun risultato qui.':'Nessun fumetto in lista. Tocca "+ Aggiungi" per iniziare.'}</div>`;
}
function gcard(i){
 const d=days(i.date),t=i.bought?'Preso':d===0?'Oggi':d<0?'Uscito':d+' gg',c=i.bought?'later':d<=0?'out':d<=set.days?'soon':'later';
 return `<div class="gc ${i.bought?'bought':''}"><div class="cov big" data-a="edit" data-id="${i.id}" role="button" aria-label="Modifica ${esc(i.title)}">${i.cover?`<img src="${esc(i.cover)}" alt="" loading="lazy" onerror="this.remove()">`:esc(i.title.slice(0,1).toUpperCase())}</div><button class="chk" data-a="buy" data-id="${i.id}" aria-label="${i.bought?'Segna come non acquistato':'Segna come acquistato'}">${i.bought?'✓':''}</button><div class="gt">${esc(i.title)}${i.num?' n. '+esc(i.num):''}</div><span class="badge ${c}">${t}</span></div>`}
function card(i){
 const d=days(i.date);let b;
 if(i.bought)b=`<span class="badge later">Acquistato</span>`;
 else if(d===0)b=`<span class="badge soon">Esce oggi</span>`;
 else if(d<0)b=`<span class="badge out">Uscito${d>-60?' da '+(-d)+' gg':''}: da comprare</span>`;
 else b=`<span class="badge ${d<=set.days?'soon':'later'}">Tra ${d} ${d===1?'giorno':'giorni'}</span>`;
 const meta=[i.type==='oneshot'?'One-shot':'Serie',i.pub,i.where,i.price?Number(i.price).toFixed(2)+' €':''].filter(Boolean).map(esc).join(', ');
 return `<article class="card ${i.bought?'bought':''}"><button class="chk" data-a="buy" data-id="${i.id}" aria-label="${i.bought?'Segna come non acquistato':'Segna come acquistato'}">${i.bought?'✓':''}</button>
 <div class="cov">${i.cover?`<img src="${esc(i.cover)}" alt="" loading="lazy" onerror="this.remove()">`:esc(i.title.slice(0,1).toUpperCase())}</div><div><h3>${esc(i.title)}${i.num?' n. '+esc(i.num):''}</h3><div class="meta">${fmt(i.date)}. ${meta}</div>${i.notes?`<div class="meta">${esc(i.notes)}</div>`:''}${b}</div>
 <div class="acts"><button class="btn g" data-a="edit" data-id="${i.id}">Modifica</button><button class="btn g" data-a="del" data-id="${i.id}">Elimina</button></div></article>`;
}
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-t]');if(t){tab=t.dataset.t;render();return}
 const a=e.target.closest('[data-a]');if(!a)return;
 const it=items.find(x=>x.id===a.dataset.id);if(!it)return;
 if(a.dataset.a==='buy'){navigator.vibrate&&navigator.vibrate(12);it.bought=!it.bought;it.boughtAt=it.bought?new Date().toLocaleDateString('sv-SE'):'';save();render()}
 if(a.dataset.a==='del'&&confirm('Eliminare "'+it.title+'"?')){items=items.filter(x=>x!==it);save();render()}
 if(a.dataset.a==='edit')openForm(it);
});
$('#q').oninput=render;

function openForm(it){
 editId=it?it.id:null;$('#fT').textContent=it?'Modifica fumetto':'Nuovo fumetto';
 const m={fTitle:'title',fNum:'num',fType:'type',fDate:'date',fPrice:'price',fPub:'pub',fWhere:'where',fNotes:'notes',fIsbn:'isbn',fCover:'cover'};
 for(const k in m)$('#'+k).value=it?(it[m[k]]??''):(k==='fType'?'serie':k==='fWhere'?'Edicola':'');
 $('#fRep').checked=false;$('#fDel').hidden=!it;$('#sug').hidden=true;$('#fRep').parentElement.hidden=!!it;$('#dForm').showModal();
}
$('#bAdd').onclick=()=>openForm();
$('#fDel').onclick=()=>{const it=items.find(x=>x.id===editId);if(it&&confirm('Eliminare "'+it.title+'"?')){items=items.filter(x=>x!==it);save();$('#dForm').close();render()}};
$('#bView').onclick=()=>{set.view=set.view==='grid'?'list':'grid';wr(KS,set);render()};
$('#fCancel').onclick=()=>$('#dForm').close();
$('#f').onsubmit=e=>{
 e.preventDefault();
 const o={title:$('#fTitle').value.trim(),num:$('#fNum').value.trim(),type:$('#fType').value,date:$('#fDate').value,price:$('#fPrice').value,pub:$('#fPub').value.trim(),where:$('#fWhere').value,notes:$('#fNotes').value.trim(),isbn:$('#fIsbn').value.trim(),cover:$('#fCover').value.trim()};
 if(!o.title||!o.date)return;
 if(editId){const it=items.find(x=>x.id===editId);Object.assign(it,o);delete sent[editId+'a'];delete sent[editId+'b']}
 else{
  items.push({id:uid(),bought:false,...o});
  if($('#fRep').checked&&o.num&&!isNaN(+o.num)){
   for(let n=1;n<=5;n++){const d=new Date(o.date+'T00:00:00');d.setMonth(d.getMonth()+n);
    items.push({id:uid(),bought:false,...o,isbn:'',num:String(+o.num+n),date:d.toLocaleDateString('sv-SE')})}
  }
 }
 save();wr(KN,sent);$('#dForm').close();render();check();autoCovers();
};

// Impostazioni
$('#bSet').onclick=()=>{const g=set.gh||{};$('#gKey').value=set.gkey||'';$('#sAlt').checked=!!set.alt;$('#catInfo').textContent=catalog.length?'Catalogo: '+['Bonelli','Panini','Topolino'].map(k=>k+' '+catalog.filter(c=>c.src===k).length).join(', ')+'. Aggiornato il '+(catUpd||'?'):'Catalogo vuoto: lancia "Aggiorna catalogo" da Actions su GitHub.';$('#gRepo').value=g.repo||'';$('#gTok').value=g.tok||'';$('#gAuto').checked=!!g.auto;$('#sNotif').checked=set.notif;$('#sDays').value=set.days;$('#dSet').showModal()};
$('#sClose').onclick=()=>{readGh();set.gkey=$('#gKey').value.trim();set.alt=$('#sAlt').checked;set.days=Math.min(30,Math.max(1,+$('#sDays').value||3));wr(KS,set);$('#dSet').close();render();check()};
$('#sNotif').onchange=async e=>{
 if(e.target.checked){
  if(!('Notification'in window)){toast('Notifiche non supportate');e.target.checked=false;return}
  const p=await Notification.requestPermission();
  if(p!=='granted'){toast('Permesso negato dal browser');e.target.checked=false;return}
 }
 set.notif=e.target.checked;wr(KS,set);
};
$('#bExp').onclick=()=>dl('fumetti-backup.json',JSON.stringify({items,set:pub()},null,1),'application/json');
$('#bImp').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{
 try{const d=JSON.parse(await e.target.files[0].text());if(!Array.isArray(d.items))throw 0;
  if(!confirm('Sostituire la lista attuale con il backup?'))return;
  items=d.items;if(d.set)set=Object.assign(set,d.set);save();wr(KS,set);render();toast('Backup ripristinato')}
 catch{toast('File non valido')}e.target.value='';
};
$('#bIcs').onclick=()=>{
 const p=n=>String(n).padStart(2,'0'),ds=s=>s.replace(/-/g,'');
 const ev=items.filter(i=>!i.bought).map(i=>{
  const e=new Date(i.date+'T00:00:00');e.setDate(e.getDate()+1);const end=e.toLocaleDateString('sv-SE').replace(/-/g,'');
  return ['BEGIN:VEVENT','UID:'+i.id+'@fumetti','DTSTAMP:'+new Date().toISOString().replace(/[-:]|\.\d+/g,''),'DTSTART;VALUE=DATE:'+ds(i.date),'DTEND;VALUE=DATE:'+end,
  'SUMMARY:'+(i.title+(i.num?' n. '+i.num:'')+' in uscita').replace(/[,;\\]/g,' '),'DESCRIPTION:'+[i.pub,i.where].filter(Boolean).join(' - ').replace(/[,;\\]/g,' '),
  'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Fumetto in uscita','TRIGGER:-P'+set.days+'D','END:VALARM',
  'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Esce oggi','TRIGGER:PT9H','END:VALARM','END:VEVENT'].join('\r\n')}).join('\r\n');
 if(!ev){toast('Nessuna uscita da esportare');return}
 dl('fumetti.ics','BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Fumetti//IT\r\n'+ev+'\r\nEND:VCALENDAR','text/calendar');
};
function dl(n,t,m){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

// Avvisi
async function notify(title,body,tag){
 try{const r=await navigator.serviceWorker?.getRegistration();
  if(r)return r.showNotification(title,{body,tag,icon:'icon.svg'});
  new Notification(title,{body,tag,icon:'icon.svg'})}catch{}
}
function check(){
 if(!set.notif||!('Notification'in window)||Notification.permission!=='granted')return;
 for(const i of items){
  if(i.bought)continue;const d=days(i.date),n=i.title+(i.num?' n. '+i.num:'');
  if(d>0&&d<=set.days&&!sent[i.id+'a']){sent[i.id+'a']=1;notify('In arrivo: '+n,'Esce tra '+d+(d===1?' giorno':' giorni')+(i.where?' ('+i.where+')':''),i.id+'a')}
  if(d<=0&&d>-8&&!sent[i.id+'b']){sent[i.id+'b']=1;notify('È uscito: '+n,(i.where||'In edicola')+(i.price?', '+Number(i.price).toFixed(2)+' €':''),i.id+'b')}
 }
 wr(KN,sent);
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){render();check()}});
// Ragnatela
(function(){const cx=400,cy=400,R=390,N=9,K=7,a0=Math.PI,a1=1.5*Math.PI,pt=(q,a)=>[cx+q*Math.cos(a),cy+q*Math.sin(a)],f=v=>v.toFixed(1);let d='';
 for(let i=0;i<N;i++){const p=pt(R,a0+(a1-a0)*i/(N-1));d+='M'+cx+' '+cy+'L'+f(p[0])+' '+f(p[1])}
 for(let k=1;k<=K;k++){const q=R*k/K;for(let i=0;i<N-1;i++){const A=a0+(a1-a0)*i/(N-1),B=a0+(a1-a0)*(i+1)/(N-1),p=pt(q,A),e=pt(q,B),c=pt(q*.84,(A+B)/2);d+='M'+f(p[0])+' '+f(p[1])+'Q'+f(c[0])+' '+f(c[1])+' '+f(e[0])+' '+f(e[1])}}
 document.body.insertAdjacentHTML('afterbegin',['r','l'].map(c=>`<svg class="web ${c}" viewBox="0 0 400 400" aria-hidden="true"><path d="${d}" fill="none" stroke="#000" stroke-width="1.6" stroke-linecap="round"/></svg>`).join(''))})();

// Ricerca suggerita: catalogo editori (Bonelli, Panini, Topolino) + Google Books
let catalog=[],catUpd='',watch=[],newList=[],sugList=[],sugT,sugSeq=0;
const nz=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
fetch('data/catalogo.json',{cache:'no-cache'}).then(x=>x.ok?x.json():null).then(j=>{if(j&&Array.isArray(j.items)){catalog=j.items;catUpd=j.updated||'';watch=j.watch||[];render()}autoCovers()}).catch(()=>{});
const splitT=t=>{const m=t.match(/(?:\bn\.?|\bnumero|\bvol\.?|\bvolume|#)\s*(\d+)\b/i)||t.match(/\s(\d{1,4})\s*$/);return m?{t:t.slice(0,m.index).replace(/[\s\-–:]+$/,'')||t,n:m[1],s:t.slice(m.index+m[0].length).replace(/^[\s\-–:]+/,'')}:{t,n:'',s:''}};
function catSearch(q){const w=nz(q).split(/\s+/).filter(Boolean);if(!w.length)return[];const now=Date.now();
 return catalog.map(c=>{const h=nz(c.title+' '+(c.num||'')+' '+(c.sub||'')+' '+(c.pub||''));if(!w.every(x=>h.includes(x)))return null;
  let sc=nz(c.title).startsWith(w[0])?3:0;const dd=c.date?Math.abs((new Date(c.date+'T00:00:00')-now)/864e5):400;sc+=2-Math.min(dd,400)/200;return{c,sc}}).filter(Boolean).sort((a,b)=>b.sc-a.sc).slice(0,6).map(x=>x.c)}
const SERIES=[['Tex','Sergio Bonelli Editore','Edicola'],['Zagor','Sergio Bonelli Editore','Edicola'],['Dylan Dog','Sergio Bonelli Editore','Edicola'],['Martin Mystère','Sergio Bonelli Editore','Edicola'],['Nathan Never','Sergio Bonelli Editore','Edicola'],['Dampyr','Sergio Bonelli Editore','Edicola'],['Mister No','Sergio Bonelli Editore','Edicola'],['Julia','Sergio Bonelli Editore','Edicola'],['Dragonero','Sergio Bonelli Editore','Edicola'],['Tex Willer','Sergio Bonelli Editore','Edicola'],['Ken Parker','Sergio Bonelli Editore','Edicola'],['Topolino','Panini Comics','Edicola'],['Amazing Spider-Man','Panini Comics','Edicola'],['Gli Incredibili X-Men','Panini Comics','Edicola'],['Wolverine','Panini Comics','Edicola']];
const rel=d=>{const n=days(d);return n>0?' (tra '+n+' gg)':n===0?' (oggi)':''};
function suggest(q){const l=catSearch(q),w=nz(q).split(/\s+/).filter(Boolean),nm=w.filter(x=>/^\d+$/.test(x)),wd=w.filter(x=>!/^\d+$/.test(x)),seen=new Set(l.map(c=>nz(c.title)));
 if(wd.length)SERIES.forEach(x=>{const h=nz(x[0]);if(!seen.has(h)&&wd.every(y=>h.split(/\s+/).some(z=>z.startsWith(y)))){seen.add(h);l.push({title:x[0],num:nm[0]||'',type:'serie',pub:x[1],where:x[2],date:'',price:'',cover:'',isbn:'',src:'Serie nota',sub:''})}});
 return l.slice(0,8)}
const tmo=u=>{const c=new AbortController();setTimeout(()=>c.abort(),7000);return fetch(u,{signal:c.signal})};
async function onlineList(q){let out=[],note='';
 try{const r=await tmo('https://www.googleapis.com/books/v1/volumes?maxResults=6&printType=books&langRestrict=it&q='+encodeURIComponent(q)+(set.gkey?'&key='+encodeURIComponent(set.gkey):''));
  if(r.ok)out=((await r.json()).items||[]).map(x=>{const v=x.volumeInfo||{},l=v.imageLinks||{},sp=splitT(v.title||''),id=(v.industryIdentifiers||[]).find(z=>z.type==='ISBN_13');
   return{title:sp.t,num:sp.n,sub:v.subtitle||sp.s,date:/^\d{4}-\d{2}-\d{2}$/.test(v.publishedDate||'')?v.publishedDate:'',price:(x.saleInfo&&x.saleInfo.listPrice&&x.saleInfo.listPrice.amount)||'',pub:v.publisher||'',cover:(l.thumbnail||l.smallThumbnail||'').replace('http://','https://').replace('&edge=curl',''),isbn:id?id.identifier:'',src:'Google Books',where:'Libreria'}});
  else note='Google Books non risponde ('+r.status+')'}catch{note='Google Books non raggiungibile'}
 if(out.length<3){try{const r=await tmo('https://openlibrary.org/search.json?language=ita&limit=6&fields=title,publisher,isbn,cover_i&q='+encodeURIComponent(q));
  if(r.ok)out=out.concat(((await r.json()).docs||[]).map(d=>{const sp=splitT(d.title||'');return{title:sp.t,num:sp.n,sub:sp.s,date:'',price:'',pub:(d.publisher||[])[0]||'',cover:d.cover_i?'https://covers.openlibrary.org/b/id/'+d.cover_i+'-M.jpg':'',isbn:(d.isbn||[]).find(z=>z.length===13)||'',src:'Open Library',where:'Libreria'}}))}catch{}}
 return{items:out,note:out.length?'':(note||'Nessun risultato online')}}
function showSug(l,st){sugList=l;const e=$('#sug');
 e.innerHTML=l.map((c,i)=>`<button type="button" data-s="${i}">${c.cover?`<img src="${esc(c.cover)}" alt="" onerror="this.outerHTML='<span class=ph></span>'">`:'<span class="ph"></span>'}<span><b>${esc(c.title)}${c.num?' n. '+esc(c.num):''}</b><small>${[c.sub,c.line||c.pub,c.date?fmt(c.date)+rel(c.date):'',c.price?Number(c.price).toFixed(2)+' €':'',c.src].filter(Boolean).map(esc).join(', ')}</small></span></button>`).join('')+(st==='loading'?'<div class="meta" style="padding:8px">Cerco online...</div>':st?`<div class="meta" style="padding:8px">${esc(st)}</div>`:'');
 e.hidden=!(l.length||st)}
$('#fTitle').addEventListener('input',()=>{clearTimeout(sugT);const q=$('#fTitle').value.trim();if(q.length<2){$('#sug').hidden=true;return}
 const seq=++sugSeq,l=suggest(q),on=!!set.alt&&navigator.onLine&&l.filter(c=>c.src!=='Serie nota').length<5;showSug(l,on?'loading':(!catalog.length?'Catalogo vuoto: lancia l\'aggiornamento su GitHub (Actions) o attiva la ricerca estesa in Impostazioni':(l.length?'':'Nessun risultato nel catalogo Bonelli e Panini')));
 if(on)sugT=setTimeout(async()=>{const g=await onlineList(q);if(seq!==sugSeq)return;const seen=new Set(l.map(k=>nz(k.title)+(k.num||'')));
  showSug(l.concat(g.items.filter(k=>!seen.has(nz(k.title)+(k.num||'')))).slice(0,9),g.note||(l.length||g.items.length?'':'Nessun risultato: compila a mano'))},350)});
$('#sug').addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(!b)return;const c=sugList[+b.dataset.s];if(!c)return;
 $('#fTitle').value=c.title;$('#fNum').value=c.num||'';$('#fType').value=c.type||(c.num?'serie':'oneshot');if(c.date)$('#fDate').value=c.date;if(c.price)$('#fPrice').value=Number(c.price).toFixed(2);
 if(c.pub)$('#fPub').value=c.pub;if(c.where)$('#fWhere').value=c.where;$('#fIsbn').value=c.isbn||'';$('#fCover').value=c.cover||'';if(c.sub&&!$('#fNotes').value)$('#fNotes').value=c.sub;
 $('#sug').hidden=true;toast(c.date?'Dati compilati':'Dati compilati: controlla la data')});

// Novita dalla tua lista
function newView(q){
 const W=new Set(watch.map(nz));
 if(!W.size)return '<div class="empty">Nessuna serie nella tua lista di ricerca. Aggiungi i titoli nel file scripts/lista.txt su GitHub.</div>';
 newList=catalog.filter(c=>W.has(nz(c.title))&&c.date&&days(c.date)>=-14&&days(c.date)<=60&&!items.some(i=>nz(i.title)===nz(c.title)&&String(i.num||'')===String(c.num||''))&&nz(c.title+' '+(c.num||'')).includes(nz(q))).sort((a,b)=>a.date.localeCompare(b.date));
 if(!newList.length)return '<div class="empty">Nessuna novità per le tue serie: o sono già nella tua lista, o non ci sono uscite negli ultimi 14 e nei prossimi 60 giorni.</div>';
 return newList.map((c,i)=>`<article class="card"><button class="chk" data-c="${i}" aria-label="Aggiungi alla lista">+</button><div class="cov">${c.cover?`<img src="${esc(c.cover)}" alt="" loading="lazy" onerror="this.remove()">`:esc(c.title.slice(0,1).toUpperCase())}</div><div><h3>${esc(c.title)}${c.num?' n. '+esc(c.num):''}</h3><div class="meta">${fmt(c.date)}${rel(c.date)}. ${[c.line||c.pub,c.price?Number(c.price).toFixed(2)+' €':''].filter(Boolean).map(esc).join(', ')}</div></div></article>`).join('')}
document.addEventListener('click',e=>{const k=e.target.closest('[data-c]');if(!k)return;const c=newList[+k.dataset.c];if(!c)return;
 items.push({id:uid(),bought:false,title:c.title,num:c.num||'',type:c.type||(c.num?'serie':'oneshot'),date:c.date,price:c.price||'',pub:c.pub||'',where:c.where||'Edicola',notes:c.sub||'',isbn:c.isbn||'',cover:c.cover||''});
 save();render();toast('Aggiunto: '+c.title+(c.num?' n. '+c.num:''))});

// Copertine e codici a barre
const pub=()=>({days:set.days,notif:set.notif});
const gb=async q=>{try{const r=await fetch('https://www.googleapis.com/books/v1/volumes?maxResults=1&langRestrict=it&q='+encodeURIComponent(q)+(set.gkey?'&key='+encodeURIComponent(set.gkey):''));if(!r.ok)return;const v=(await r.json()).items?.[0]?.volumeInfo;if(!v)return null;
 const l=v.imageLinks||{};const c=(l.thumbnail||l.smallThumbnail||'').replace('http://','https://').replace('&edge=curl','');return{title:v.title,pub:v.publisher,cover:c}}catch{}};
$('#bFind').onclick=async()=>{const isbn=$('#fIsbn').value.trim(),t=$('#fTitle').value.trim();if(!isbn&&!t){toast('Inserisci titolo o ISBN');return}
 const x=await gb(isbn?'isbn:'+isbn:'intitle:'+t+' '+$('#fNum').value);
 if(x&&x.cover){$('#fCover').value=x.cover;toast('Copertina trovata')}else toast('Non trovata: incolla un link o scatta una foto')};
$('#bPhoto').onclick=()=>$('#fPhoto').click();
$('#fPhoto').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const h=Math.min(260,im.height),w=Math.round(im.width*h/im.height),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);$('#fCover').value=c.toDataURL('image/jpeg',.7);URL.revokeObjectURL(im.src)};im.src=URL.createObjectURL(f);e.target.value=''};
let stream;
function stopScan(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;if($('#dScan').open)$('#dScan').close()}
$('#scClose').onclick=stopScan;
$('#bScan').onclick=async()=>{
 if(!('BarcodeDetector'in window)){toast('Scanner non supportato: usa Chrome su Android');return}
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});const v=$('#vid');v.srcObject=stream;await v.play();$('#dScan').showModal();
  const det=new BarcodeDetector({formats:['ean_13','ean_8']});
  const loop=async()=>{if(!stream)return;try{const b=await det.detect(v);if(b[0]){const code=b[0].rawValue;stopScan();$('#fIsbn').value=code;const x=await gb('isbn:'+code);
    if(x){if(!$('#fTitle').value)$('#fTitle').value=x.title||'';if(!$('#fPub').value)$('#fPub').value=x.pub||'';if(x.cover)$('#fCover').value=x.cover;toast('Fumetto riconosciuto')}else toast('Codice letto, nessun dato trovato');return}}catch{}requestAnimationFrame(loop)};loop()
 }catch{stopScan();toast('Fotocamera non disponibile')}};
let acBusy=false;
async function autoCovers(){if(acBusy||!navigator.onLine)return;acBusy=true;let n=0,ch=false;
 for(const i of items){if(i.cover||i.nocov||n>=8)continue;n++;
  const cm=catalog.find(c=>c.cover&&nz(c.title)===nz(i.title)&&String(c.num||'')===String(i.num||''));if(cm){i.cover=cm.cover;ch=true;continue}
  const x=await gb(i.isbn?'isbn:'+i.isbn:'intitle:'+i.title+(i.num?' '+i.num:''));
  if(x&&x.cover){i.cover=x.cover;ch=true}else if(x===null||(x&&!x.cover)){i.nocov=1;ch=true}}
 acBusy=false;if(ch){save();render()}}

// Serie e statistiche
function seriesView(q){
 const g={};items.filter(i=>i.type==='serie'&&i.title.toLowerCase().includes(q)).forEach(i=>{(g[i.title.trim().toLowerCase()]=g[i.title.trim().toLowerCase()]||[]).push(i)});
 const k=Object.keys(g).sort();if(!k.length)return '<div class="empty">Nessuna serie. Aggiungi un fumetto di tipo Serie con il numero.</div>';
 return k.map(x=>{const a=g[x],nums=a.map(i=>parseInt(i.num)).filter(n=>n>0),own=new Set(a.filter(i=>i.bought).map(i=>parseInt(i.num))),mx=Math.max(0,...nums),mn=nums.length?Math.min(...nums):1,miss=[];
  for(let n=mn;n<=mx;n++)if(!own.has(n))miss.push(n);
  return `<div class="grp"><h3 style="margin:0">${esc(a[0].title)}</h3><div class="meta">${esc(a[0].pub||'')}${nums.length?' Numeri dal '+mn+' al '+mx:''}</div><p style="margin:6px 0 0">Acquistati ${a.filter(i=>i.bought).length} su ${a.length}${miss.length?'. Mancano: '+miss.slice(0,40).join(', ')+(miss.length>40?'...':''):'. Nessun numero mancante.'}</p></div>`}).join('')}
function statsView(){
 const ym=d=>d.slice(0,7),m=ym(new Date().toLocaleDateString('sv-SE')),pr=i=>+i.price||0,sum=a=>a.reduce((t,i)=>t+pr(i),0).toFixed(2)+' €';
 const bo=items.filter(i=>i.bought),sp={};bo.forEach(i=>{const k=ym(i.boughtAt||i.date);sp[k]=(sp[k]||0)+pr(i)});
 const buy=items.filter(i=>!i.bought&&days(i.date)<=0),soon=items.filter(i=>!i.bought&&days(i.date)>0&&days(i.date)<=30);
 const ks=Object.keys(sp).sort().slice(-6),mx=Math.max(1,...ks.map(k=>sp[k]));
 return `<div class="grp"><h3 style="margin:0">Questo mese</h3><p style="margin:6px 0 0">Speso: ${(sp[m]||0).toFixed(2)} €<br>Da comprare ora: ${buy.length} (${sum(buy)})<br>In uscita nei prossimi 30 giorni: ${soon.length} (${sum(soon)})</p></div>
 <div class="grp"><h3 style="margin:0">Spesa degli ultimi mesi</h3>${ks.map(k=>`<div class="stat"><span>${k}</span><span class="bar2" style="width:${Math.round(sp[k]/mx*55)}%"></span><span>${sp[k].toFixed(2)} €</span></div>`).join('')||'<p class="meta">Nessun acquisto registrato.</p>'}</div>
 <div class="grp"><h3 style="margin:0">Totali</h3><p style="margin:6px 0 0">${bo.length} acquistati su ${items.length}. Spesa totale: ${sum(bo)}</p></div>`}

// Sincronizzazione GitHub
const GP='data/fumetti.json',gh=()=>set.gh&&set.gh.repo&&set.gh.tok?set.gh:null;
const b64=t=>btoa(unescape(encodeURIComponent(t))),unb=t=>decodeURIComponent(escape(atob(t.replace(/\n/g,''))));
const gReq=(g,o)=>fetch('https://api.github.com/repos/'+g.repo+'/contents/'+GP,Object.assign({headers:{Authorization:'Bearer '+g.tok,Accept:'application/vnd.github+json'}},o||{}));
function readGh(){set.gh={repo:$('#gRepo').value.trim(),tok:$('#gTok').value.trim(),auto:$('#gAuto').checked};wr(KS,set)}
async function push(quiet){const g=gh();if(!g){quiet||toast('Inserisci repository e token');return}
 try{let sha;const r=await gReq(g);if(r.ok)sha=(await r.json()).sha;else if(r.status!==404)throw 0;
  const w=await gReq(g,{method:'PUT',body:JSON.stringify({message:'Aggiorna fumetti',content:b64(JSON.stringify({items,set:pub()},null,1)),sha})});
  if(!w.ok)throw 0;quiet||toast('Salvato su GitHub')}catch{toast('Sincronizzazione non riuscita: controlla repository e token')}}
async function pull(){const g=gh();if(!g){toast('Inserisci repository e token');return}
 try{const r=await gReq(g);if(!r.ok)throw 0;const d=JSON.parse(unb((await r.json()).content));if(!Array.isArray(d.items))throw 0;
  if(!confirm('Sostituire la lista attuale con quella su GitHub?'))return;items=d.items;save(true);render();toast('Ripristinato da GitHub')}catch{toast('Nessun dato trovato su GitHub')}}
$('#gPush').onclick=()=>{readGh();push()};
$('#gPull').onclick=()=>{readGh();pull()};

if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();check();autoCovers();
</script>
